<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 근처 찾기</title>
<style>
:root{--bg:#FBF7EE;--card:#fff;--ink:#1d2433;--muted:#6b6f78;--accent:#1F3A60;--line:#e8e1d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line);z-index:2}
h1{font-size:20px;margin:0 0 4px}#st{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:15px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:10px 16px 40px}.row{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.nm{font-weight:700;font-size:16px}.d{color:var(--accent);font-weight:700;font-size:14px;margin:2px 0}.m{color:var(--muted);font-size:13px}
.ja{display:inline-block;max-width:100%;text-align:left;color:var(--ink);font-family:inherit;font-size:14px;line-height:1.35;border:1px dashed #d8ccb0;border-radius:8px;padding:5px 9px;background:#fffdf7;word-break:keep-all;overflow-wrap:anywhere}
.jw{display:inline-flex;flex-direction:column;align-items:flex-start;max-width:100%;margin:8px 0 0}.jw small{font-size:11.5px;color:var(--muted);margin:2px 0 0 4px;line-height:1.3}
.why0{font-size:14px;margin:4px 0 0;line-height:1.4}.m{overflow-wrap:anywhere;margin-top:3px}
.go{display:inline-block;margin:10px 8px 0 0;padding:7px 12px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:700}
.pay{display:inline-block;white-space:nowrap;vertical-align:1px;font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;background:#eef2f8;color:var(--accent);font-weight:700}
.hd{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;color:inherit}.more{font-size:13px;color:var(--accent);margin-top:4px;font-weight:700}.det{margin:8px 0 2px;padding-top:8px;border-top:1px dashed var(--line);font-size:14.5px}.det p{margin:0 0 8px}.why{font-weight:600}.tip{background:#fff7e0;border-radius:8px;padding:6px 8px}.lk{display:inline-block;margin:4px 12px 4px 0;color:var(--accent);font-weight:700;font-size:14px}.row.op{outline:2px solid var(--accent)}
.hd{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:start}.hd.np{grid-template-columns:1fr}.th{width:76px;height:76px;border-radius:10px;object-fit:cover;background:#eee8da;display:block}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:4px 0 8px}.gal img{flex:0 0 88%;max-width:88%;height:220px;object-fit:cover;border-radius:12px;scroll-snap-align:start;background:#eee8da}.gal img:only-child{flex-basis:100%;max-width:100%}.nph{font-size:12px;color:var(--muted)}
.btn{display:block;width:100%;margin:10px 0;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
</style></head><body>
<header><h1>📍 내 근처 가이드북 장소</h1><div id="st">위치를 찾는 중…</div><div class="chips" id="chips"></div></header>
<main id="list"></main>
<script>
const PAYL={cash:'💴 현금만',mixed:'💴 현금 준비',card:'💳 카드 OK',free:'🆓 무료',check:'❓ 결제 확인'};
const CATS=[['전체',null],['식사',['식사']],['구경',['풍경','구경']],['쇼핑',['쇼핑']],['쉬기',['휴식','온천·쉬기']]];
let P=[],me=null,cat='전체',O={r:30,mode:'car'};
function bytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function dec(h){if(h[0]==='z'){const st=new Blob([bytes(h.slice(1))]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(st).text())}return JSON.parse(new TextDecoder().decode(bytes(h)))}
const mapP=x=>({n:x[0],ja:x[1],c:x[2],p:x[3],la:x[4]/1e5,lo:x[5]/1e5,m:x[6],why:x[7],note:x[8],menu:x[9],addr:x[10],payt:x[11],off:x[12],blog:x[13],area:x[14],tips:x[15],ph:(x[16]||'').split(',').filter(Boolean)});
const TH=(d,w)=>'https://drive.google.com/thumbnail?id='+encodeURIComponent(d)+'&sz=w'+w;
let open1=null;
async function load(){let h=location.hash.slice(1);if(h){try{localStorage.setItem('nearP',h)}catch(e){}}else{try{h=localStorage.getItem('nearP')||''}catch(e){}}
 if(h){try{let d=await dec(h);if(!Array.isArray(d)){O=Object.assign(O,d.o||{});d=d.p||[]}P=d.map(mapP)}catch(e){}}
 if(O.bg)document.documentElement.style.setProperty('--bg',O.bg);if(O.accent)document.documentElement.style.setProperty('--accent',O.accent);if(O.title)document.title=O.title}
const ko=s=>String(s||'').replace(/⭐/g,'').replace(/\s*\([^)]*\)/g,'').trim();
const chip=(v,lab)=>'<span class="jw"><button class="ja" data-cp="'+esc(v)+'">📋 '+esc(v)+'</button>'+(lab?'<small>'+esc(lab)+'</small>':'')+'</span>';
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function km(a,b,c,d){const r=Math.PI/180,x=Math.sin((c-a)*r/2),y=Math.sin((d-b)*r/2);return 12742*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y))}
function tm(k){const w=Math.round(k*1300/80);if(w<=20)return(k<1?Math.round(k*100)*10+'m':k.toFixed(1)+'km')+' · 걸어서 약 '+Math.max(1,w)+'분';return(k<10?k.toFixed(1):Math.round(k))+'km · '+(O.mode==='car'?'차로':'차·택시로')+' 약 '+Math.round(k*1.4/40*60+3)+'분'}
function draw(){if(!P.length){document.getElementById('list').innerHTML='<p>장소 목록이 없어요. 일정 HTML의 📍 버튼으로 다시 열어 주세요.</p>';return}
 if(!me)return;const cs=cat==='전체'?null:[cat].concat((CATS.find(x=>x[0]===cat)||[0,[]])[1]||[]);
 const all=P.map(p=>Object.assign({k:km(me.la,me.lo,p.la,p.lo)},p)).sort((a,b)=>a.k-b.k);const near=all.filter(x=>x.k<=O.r);
 const known=CATS.flatMap(x=>x[1]||[]),extra=[...new Set(near.map(x=>x.c).filter(c=>c&&!known.includes(c)&&c!=='교통'&&c!=='숙소'))],CS=CATS.concat(extra.map(c=>[c,[c]]));
 document.getElementById('chips').innerHTML=near.length?CS.map(([c,cc])=>{const n=cc?near.filter(x=>cc.includes(x.c)).length:near.length;return n||!cc?'<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+c+' '+n+'</button>':''}).join(''):'';
 const sh=(cs?near.filter(x=>cs.includes(x.c)):near).slice(0,40);
 document.getElementById('list').innerHTML=(near.length?'':'<p>'+O.r+'km 안에 가이드북 장소가 없어요 (가장 가까운 곳 '+Math.round(all[0].k)+'km). 여행지에 도착해서 다시 눌러 보세요.</p>')+
 sh.map((x,i)=>{const id=x.n,op=open1===id;const det=op?'<div class="det">'+(x.ph.length?'<div class="gal">'+x.ph.map(d=>'<img loading="lazy" referrerpolicy="no-referrer" src="'+TH(d,800)+'" alt="'+esc(x.n)+'" onerror="this.remove()">').join('')+'</div>'+(x.ph.length>1?'<p class="nph">옆으로 넘겨 보기 · '+x.ph.length+'장</p>':''):'')+(x.payt?'<p><b>💳</b> '+esc(x.payt)+'</p>':'')+(x.menu?'<p><b>🍽</b> '+esc(x.menu)+'</p>':'')+(x.note&&x.note.replace(/참고 글[^.]*\.\s*/g,'').trim()?'<p>'+esc(x.note.replace(/참고 글[^.]*\.\s*/g,''))+'</p>':'')+(x.tips?'<p class="tip">💡 '+esc(x.tips).replace(/\n/g,'<br>💡 ')+'</p>':'')+(x.addr?chip(x.addr,'주소 (눌러서 복사)')+'<br>':'')+
  (x.off?'<a class="lk" target="_blank" rel="noopener" href="'+esc(x.off)+'">공식 정보 ↗</a>':'')+(x.blog?'<a class="lk" target="_blank" rel="noopener" href="'+esc(x.blog)+'">블로그 후기 ↗</a>':'')+'</div>':'';
 const th=x.ph.length&&!op?'<img class="th" loading="lazy" referrerpolicy="no-referrer" src="'+TH(x.ph[0],240)+'" alt="" onerror="this.style.visibility=\'hidden\'">':'';
 return '<div class="row'+(op?' op':'')+'"><button class="hd'+(th?'':' np')+'" data-o="'+esc(id)+'">'+th+'<div><div class="nm">'+esc(x.n)+(PAYL[x.p]?'<span class="pay">'+PAYL[x.p]+'</span>':'')+'</div><div class="d">'+tm(x.k)+(x.area?' · '+esc(x.area):'')+'</div>'+(x.why?'<p class="why0">'+esc(x.why)+'</p>':'')+(x.m?'<div class="m">'+esc(x.m)+'</div>':'')+'<div class="more">'+(op?'접기 ▲':(x.menu||x.note||x.tips||x.addr||x.ph.length?(x.ph.length?'사진 '+x.ph.length+'장 · ':'')+'메뉴·팁 더 보기 ▼':''))+'</div></div></button>'+det+
 (x.ja?chip(x.ja,ko(x.n))+'<br>':'')+'<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+x.la+','+x.lo+'&travelmode='+(x.k<1.6?'walking':(O.mode==='car'?'driving':'transit'))+'">🧭 길찾기</a></div>'}).join('')}
document.addEventListener('click',e=>{const o=e.target.closest('[data-o]');if(o){open1=open1===o.dataset.o?null:o.dataset.o;draw();return}const b=e.target.closest('[data-c]');if(b){cat=b.dataset.c;draw()}if(e.target.id==='again')locate();const q=e.target.closest('[data-cp]');if(q){const v=q.dataset.cp;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>{q.textContent='✅ 복사됨';setTimeout(()=>q.textContent='📋 '+v,1200)}).catch(()=>{})}});
function locate(){const st=document.getElementById('st');st.textContent='위치를 찾는 중…';
 if(!navigator.geolocation){st.textContent='이 브라우저는 위치를 못 써요';return}
 navigator.geolocation.getCurrentPosition(p=>{me={la:p.coords.latitude,lo:p.coords.longitude};st.innerHTML='내 위치 기준 · 직선거리로 어림 <button class="chip" id="again">🔄 다시</button>';draw()},
 e=>{st.innerHTML='위치를 못 받았어요('+e.code+'). 크롬 주소창 왼쪽 자물쇠 → 위치 허용 후 <button class="chip" id="again">🔄 다시</button>'},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
load().then(()=>{draw();locate()});
</script></body></html>
